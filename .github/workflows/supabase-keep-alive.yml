name: Supabase keep alive

on:
  schedule:
    - cron: "0 6 * * 1,4" # mandag og torsdag kl. 06 (UTC)
  workflow_dispatch: # gør det muligt at køre den manuelt

jobs:
  ping:
    # Henter variablerne fra samme environment som dit deploy-workflow
    environment: github-pages-deployment
    runs-on: ubuntu-latest
    env:
      # En tabel, der findes i Supabase-projektet (se supabase/starter.sql)
      PING_TABLE: events
    steps:
      # VITE_SUPABASE_URL er projekt-URL'en (https://<ref>.supabase.co), så REST-stien tilføjes her
      - name: Ping Supabase
        run: |
          curl --fail -sS -o /dev/null \
            "${{ vars.VITE_SUPABASE_URL }}/rest/v1/$PING_TABLE?select=id&limit=1" \
            -H "apikey: ${{ vars.VITE_SUPABASE_APIKEY }}"
